syntax = "proto3";

option java_package = "com.mahasiswa.sigma";
option java_multiple_files = true;

message DisasterReportEntry {
  string id = 1;
  string title = 2;
  string description = 3;
  string location = 4;
  string reporter = 5;
  string status = 6;
  int64 timestamp = 7;
}

message DisasterReportsData {
  repeated DisasterReportEntry reports = 1;
}
