syntax = "proto3";

option java_package = "com.mahasiswa.sigma";
option java_multiple_files = true;

message VolunteerEntry {
  string username = 1;
  string name = 2;
  string skill = 3;
  string address = 4;
  string phone_number = 5;
  string status = 6;
}

message VolunteerData {
  repeated VolunteerEntry registrations = 1;
}
