# Project-wide Gradle settings.
kotlin.code.style=official
android.useAndroidX=true
android.enableJetifier=true

# Force Gradle to use the JDK bundled with Android Studio
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr

# Performance and Memory optimizations
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configuration-cache=false

# Disable VFS watching to prevent OneDrive file locking issues
org.gradle.vfs.watch=false

# Use daemon strategy to avoid file locking issues common with 'in-process' on Windows
kotlin.compiler.execution.strategy=daemon

# Disable incremental KSP and Kotlin to prevent persistent locks in build folder
ksp.incremental=false
kotlin.incremental=false
